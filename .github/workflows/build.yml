name: Build iTest

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # bước đăng trang web cần đọc danh sách artifact của lần chạy (bắt buộc với repo riêng tư)

env:
  # Đặt secret CODESIGN_PFX_BASE64 (file .pfx mã hoá base64) và CODESIGN_PASSWORD để tự động ký số.
  CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Xác định phiên bản (lấy từ Directory.Build.props)
        id: ver
        shell: pwsh
        run: |
          # Số phiên bản chỉ khai báo ở một nơi: <Version> trong Directory.Build.props.
          [xml]$props = Get-Content Directory.Build.props
          $v = "$($props.Project.PropertyGroup.Version)".Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Không đọc được <Version> hợp lệ trong Directory.Build.props (đọc được: '$v')." }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $v) { throw "Tag v$tag không khớp phiên bản $v trong Directory.Build.props. Sửa <Version> rồi đẩy lại tag." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $v · .NET SDK $(dotnet --version)"

      - name: Kiểm thử tự động phần lõi
        shell: pwsh
        run: |
          dotnet test tests/iTest.Core.Tests/iTest.Core.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=core.trx" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Kiểm thử phần lõi thất bại." }

      - name: Kiểm thử trên Windows (nhập Word, xuất điểm, gói kết quả)
        shell: pwsh
        run: |
          dotnet test tests/iTest.Windows.Tests/iTest.Windows.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=windows.trx" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Kiểm thử trên Windows thất bại." }

      - name: Lưu báo cáo kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaoCao-KiemThu
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Build & publish 3 ứng dụng (tự chứa runtime)
        shell: pwsh
        run: |
          # Ba ứng dụng WPF được publish dạng THƯ MỤC (exe + các dll), không gộp một-file:
          # trên .NET 11, bản gộp một-file không nạp được DirectWriteForwarder.dll của WPF nên ứng dụng tắt ngay khi mở.
          # Bộ cài vẫn chỉ là một file Setup. Công cụ thử tải (dòng lệnh, không dùng WPF) vẫn gộp một-file.
          $base = @('-c','Release','-r','win-x64','--self-contained','true',"-p:Version=${{ steps.ver.outputs.version }}")
          $single = @('-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true')
          $apps = @(
            @{ Proj = 'src/iTest.Client/iTest.Client.csproj';       Out = 'publish/iTest';        Exe = 'iTest.exe';          Extra = @() },
            @{ Proj = 'src/iTest.Server/iTest.Server.csproj';       Out = 'publish/iTest-Server'; Exe = 'iTest-Server.exe';   Extra = @() },
            @{ Proj = 'src/iTest.Editor/iTest.Editor.csproj';       Out = 'publish/iTest-Editor'; Exe = 'iTest-Editor.exe';   Extra = @() },
            @{ Proj = 'tools/iTest.LoadTest/iTest.LoadTest.csproj'; Out = 'publish/LoadTest';     Exe = 'iTest-LoadTest.exe'; Extra = $single }
          )
          # Kiểm tra lỗi sau TỪNG lệnh publish (PowerShell chỉ tự dừng theo lệnh cuối cùng) và kiểm tra file .exe thực sự được tạo.
          foreach ($a in $apps) {
            $extra = $a.Extra
            dotnet publish $a.Proj @base @extra -o $a.Out
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish lỗi với $($a.Proj) (mã $LASTEXITCODE)." }
            $exe = Join-Path $a.Out $a.Exe
            if (-not (Test-Path $exe)) { throw "Không thấy $exe sau khi publish $($a.Proj)." }
            $size = (Get-ChildItem $a.Out -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            Write-Host ("{0}: {1} file, {2:N1} MB" -f $a.Out, (Get-ChildItem $a.Out -Recurse -File).Count, $size)
          }

      - name: Ký số các file .exe ứng dụng (khi có chứng thư số)
        if: env.CODESIGN_PFX_BASE64 != ''
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: pwsh
        run: ./installer/sign.ps1 -Files (Get-ChildItem publish -Recurse -Filter *.exe | ForEach-Object FullName)

      - name: Cài Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Tạo bộ cài .exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($f in 'iTest','iTest-Server','iTest-Editor') {
            & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\$f.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC lỗi với $f" }
          }
          $made = @(Get-ChildItem dist -Filter *.exe)
          if ($made.Count -ne 3) { throw "Cần 3 bộ cài trong dist, chỉ thấy $($made.Count)." }
          $made | Format-Table Name, Length

      - name: Cài thử và mở thử ứng dụng từ bộ cài
        shell: pwsh
        run: |
          # Chạy đúng các file Setup sẽ phát hành: cài, cài đè lần hai (đi qua bước gỡ bản cũ), rồi mở ứng dụng đã cài.
          # Ứng dụng phải còn chạy và có cửa sổ sau 15 giây; nếu không, in lỗi của .NET và dừng build.
          $apps = [ordered]@{
            'iTest'        = @('dist/iTest-Setup.exe',        "$env:ProgramFiles\iTest\iTest\iTest.exe")
            'iTest-Server' = @('dist/iTest-Server-Setup.exe', "$env:ProgramFiles\iTest\iTest-Server\iTest-Server.exe")
            'iTest-Editor' = @('dist/iTest-Editor-Setup.exe', "$env:ProgramFiles\iTest\iTest-Editor\iTest-Editor.exe")
          }
          $failed = @()
          foreach ($name in $apps.Keys) {
            $setup = $apps[$name][0]; $exe = $apps[$name][1]; $dir = Split-Path $exe
            foreach ($round in 1, 2) {
              if ($round -eq 2) { Set-Content (Join-Path $dir 'file-cu-con-sot.dll') 'rác của bản cũ' }
              $log = Join-Path $env:RUNNER_TEMP "$name-setup-$round.log"
              $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -PassThru -Wait
              if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { Get-Content $log -Tail 40; throw "Cài $name lần $round thất bại (mã $($p.ExitCode))." }
            }
            if (Test-Path (Join-Path $dir 'file-cu-con-sot.dll')) { throw "${name}: cài đè không xoá file của bản cũ." }
            $since = Get-Date
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 15
            $p.Refresh()
            $ok = (-not $p.HasExited) -and ($p.MainWindowHandle -ne 0)
            Write-Host "== ${name}: đã thoát=$($p.HasExited) · cửa sổ=$($p.MainWindowHandle) · tiêu đề='$($p.MainWindowTitle)'"
            if ($p.HasExited) { Write-Host "   mã thoát: $($p.ExitCode)" } else { Stop-Process -Id $p.Id -Force }
            $err = Join-Path $env:LOCALAPPDATA "$name\loi.log"
            if (Test-Path $err) { Write-Host "   --- loi.log ---"; Get-Content $err -Tail 60; $ok = $false }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } |
              Select-Object -First 2 | ForEach-Object { Write-Host "   --- $($_.ProviderName) ---"; Write-Host $_.Message }
            if (-not $ok) { $failed += $name }
          }
          # Công cụ thử tải (một-file): không được chết vì lỗi nạp runtime.
          $lt = Start-Process -FilePath 'publish/LoadTest/iTest-LoadTest.exe' -ArgumentList '--host', '127.0.0.1', '--pin', '0000', '--clients', '1' -PassThru
          Start-Sleep -Seconds 6
          $lt.Refresh()
          if ($lt.HasExited -and $lt.ExitCode -eq -532462766) { $failed += 'iTest-LoadTest' } elseif (-not $lt.HasExited) { Stop-Process -Id $lt.Id -Force }
          Write-Host "== iTest-LoadTest: đã thoát=$($lt.HasExited)"
          if ($failed.Count -gt 0) { throw "Ứng dụng không mở được sau khi cài: $($failed -join ', ')" }

      - name: Ký số các bộ cài (khi có chứng thư số)
        if: env.CODESIGN_PFX_BASE64 != ''
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: pwsh
        run: ./installer/sign.ps1 -Files (Get-ChildItem dist -Filter *.exe | ForEach-Object FullName)

      - name: Đóng gói công cụ thử tải
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LoadTest/iTest-LoadTest.exe -DestinationPath dist/iTest-LoadTest.zip -Force
          if (-not (Test-Path dist/iTest-LoadTest.zip)) { throw "Không tạo được dist/iTest-LoadTest.zip." }

      - uses: actions/upload-artifact@v4
        with:
          name: iTest-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/iTest-LoadTest.zip

      - name: Phát hành (khi đẩy tag v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/iTest-LoadTest.zip
          generate_release_notes: true

  website:
    # Cần bật một lần: Settings → Pages → Source: GitHub Actions.
    # Nếu chưa bật, bước này chỉ báo cảnh báo và không làm hỏng lần build.
    # Chỉ đăng web từ nhánh main: môi trường github-pages chặn đăng từ tag.
    if: github.ref == 'refs/heads/main'
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gắn đường dẫn tải xuống của repo này
        run: sed -i "s#__REPO__#${{ github.repository }}#g" website/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v5
