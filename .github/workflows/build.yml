name: Build iTest

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # Đặt secret CODESIGN_PFX_BASE64 (file .pfx mã hoá base64) và CODESIGN_PASSWORD để tự động ký số.
  CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Xác định phiên bản (lấy từ Directory.Build.props)
        id: ver
        shell: pwsh
        run: |
          # Số phiên bản chỉ khai báo ở một nơi: <Version> trong Directory.Build.props.
          [xml]$props = Get-Content Directory.Build.props
          $v = "$($props.Project.PropertyGroup.Version)".Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Không đọc được <Version> hợp lệ trong Directory.Build.props (đọc được: '$v')." }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $v) { throw "Tag v$tag không khớp phiên bản $v trong Directory.Build.props. Sửa <Version> rồi đẩy lại tag." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $v · .NET SDK $(dotnet --version)"

      - name: Kiểm thử tự động phần lõi
        shell: pwsh
        run: |
          dotnet test tests/iTest.Core.Tests/iTest.Core.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=core.trx" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Kiểm thử phần lõi thất bại." }

      - name: Kiểm thử trên Windows (nhập Word, xuất điểm, gói kết quả)
        shell: pwsh
        run: |
          dotnet test tests/iTest.Windows.Tests/iTest.Windows.Tests.csproj -c Release --results-directory TestResults --logger "trx;LogFileName=windows.trx" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Kiểm thử trên Windows thất bại." }

      - name: Lưu báo cáo kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaoCao-KiemThu
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Build & publish 3 ứng dụng (self-contained, 1 file)
        shell: pwsh
        run: |
          $common = @('-c','Release','-r','win-x64','--self-contained','true',
                      '-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',
                      '-p:EnableCompressionInSingleFile=true',"-p:Version=${{ steps.ver.outputs.version }}")
          $apps = [ordered]@{
            'src/iTest.Client/iTest.Client.csproj'     = @('publish/iTest',        'iTest.exe')
            'src/iTest.Server/iTest.Server.csproj'     = @('publish/iTest-Server', 'iTest-Server.exe')
            'src/iTest.Editor/iTest.Editor.csproj'     = @('publish/iTest-Editor', 'iTest-Editor.exe')
            'tools/iTest.LoadTest/iTest.LoadTest.csproj' = @('publish/LoadTest',   'iTest-LoadTest.exe')
          }
          # Kiểm tra lỗi sau TỪNG lệnh publish (PowerShell chỉ tự dừng theo lệnh cuối cùng) và kiểm tra file .exe thực sự được tạo.
          foreach ($proj in $apps.Keys) {
            $out = $apps[$proj][0]; $exe = Join-Path $out $apps[$proj][1]
            dotnet publish $proj @common -o $out
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish lỗi với $proj (mã $LASTEXITCODE)." }
            if (-not (Test-Path $exe)) { throw "Không thấy $exe sau khi publish $proj." }
            Write-Host ("{0}: {1:N1} MB" -f $exe, ((Get-Item $exe).Length / 1MB))
          }

      - name: Ký số các file .exe ứng dụng (khi có chứng thư số)
        if: env.CODESIGN_PFX_BASE64 != ''
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: pwsh
        run: ./installer/sign.ps1 -Files (Get-ChildItem publish -Recurse -Filter *.exe | ForEach-Object FullName)

      - name: Cài Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Tạo bộ cài .exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          foreach ($f in 'iTest','iTest-Server','iTest-Editor') {
            & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\$f.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC lỗi với $f" }
          }
          $made = @(Get-ChildItem dist -Filter *.exe)
          if ($made.Count -ne 3) { throw "Cần 3 bộ cài trong dist, chỉ thấy $($made.Count)." }
          $made | Format-Table Name, Length

      - name: Ký số các bộ cài (khi có chứng thư số)
        if: env.CODESIGN_PFX_BASE64 != ''
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        shell: pwsh
        run: ./installer/sign.ps1 -Files (Get-ChildItem dist -Filter *.exe | ForEach-Object FullName)

      - name: Đóng gói công cụ thử tải
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LoadTest/iTest-LoadTest.exe -DestinationPath dist/iTest-LoadTest.zip -Force
          if (-not (Test-Path dist/iTest-LoadTest.zip)) { throw "Không tạo được dist/iTest-LoadTest.zip." }

      - uses: actions/upload-artifact@v4
        with:
          name: iTest-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/iTest-LoadTest.zip

      - name: Phát hành (khi đẩy tag v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/iTest-LoadTest.zip
          generate_release_notes: true

  website:
    # Cần bật một lần: Settings → Pages → Source: GitHub Actions.
    # Nếu chưa bật, bước này chỉ báo cảnh báo và không làm hỏng lần build.
    # Chỉ đăng web từ nhánh main: môi trường github-pages chặn đăng từ tag.
    if: github.ref == 'refs/heads/main'
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gắn đường dẫn tải xuống của repo này
        run: sed -i "s#__REPO__#${{ github.repository }}#g" website/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
